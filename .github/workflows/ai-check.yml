name: AI check of symbol submissions
# Claude checks each new [symbol] submission: the device's connectors against the maker's data, its size and power, where
# each connector sits on the panels, and whether the library already has it. The result is a comment on the issue that
# the symbol desk shows, with "the AI version" of the symbol to take or leave. Nothing is changed or published here.
# Every run goes through ALL the submissions that want a check (scripts/ai/check.mjs), so a run that the concurrency
# queue drops loses nothing, and the hourly one picks up whatever is left (today's limit reached, a run that failed).
# Switch it on with the repository secret ANTHROPIC_API_KEY; without it every run ends at once.
# Optional repository variables: AI_MODEL (claude-opus-5-5), AI_EFFORT (high), AI_DAILY_MAX (10), AI_MAX_USD (3), AI_SINCE
# (2026-11-21: a submission sent before it is checked only when asked for, with the ai-check label or the desk's button).
# Run by hand (Actions > this workflow > Run workflow): issue numbers to check ("69,70,71"), a model and an effort for that
# run alone, and TRIAL: nothing is posted or labelled, and the comments it would have posted are the run's artifact
# (ai-trial), to try another model on submissions that already have a check.
on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue numbers to check, e.g. 69 or 69,70,71 (empty: every submission waiting for a check)"
        required: false
      model:
        description: "Model for this run only, e.g. claude-sonnet-5-5 (empty: the AI_MODEL variable, else claude-opus-5-5)"
        required: false
      effort:
        description: "Effort for this run only: low, medium, high, xhigh or max (empty: the AI_EFFORT variable, else high)"
        required: false
      trial:
        description: "Trial: post nothing and change no labels; the results are the run's artifact (needs issue numbers)"
        type: boolean
        default: false
permissions:
  issues: write
  contents: read
concurrency:
  group: ai-check
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.event_name != 'issues' ||
      (github.event.action == 'opened' && (startsWith(github.event.issue.title, '[symbol]') || contains(github.event.issue.body, 'Symbol submission from SignalFlow'))) ||
      (github.event.action == 'labeled' && github.event.label.name == 'ai-check')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "No ANTHROPIC_API_KEY secret, so the AI check is off. Add it under Settings > Secrets and variables > Actions."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_KEY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.HAS_KEY == 'true'
        working-directory: scripts/ai
        run: npm ci --no-audit --no-fund
      # The issue number travels in env vars only: nothing a submitter wrote is pasted into this script.
      - if: env.HAS_KEY == 'true'
        run: node scripts/ai/check.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          ISSUE: ${{ github.event.inputs.issue }}
          AI_MODEL: ${{ github.event.inputs.model || vars.AI_MODEL }}
          AI_EFFORT: ${{ github.event.inputs.effort || vars.AI_EFFORT }}
          AI_TRIAL: ${{ github.event.inputs.trial }}
          AI_DAILY_MAX: ${{ vars.AI_DAILY_MAX }}
          AI_MAX_USD: ${{ vars.AI_MAX_USD }}
          AI_SINCE: ${{ vars.AI_SINCE }}
      - if: always() && env.HAS_KEY == 'true' && github.event.inputs.trial == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-trial
          path: ai-trial/
          retention-days: 14
          if-no-files-found: warn
