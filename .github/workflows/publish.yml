name: Publish approved symbol
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
jobs:
  publish:
    if: github.event.label.name == 'approved' && (startsWith(github.event.issue.title, '[symbol]') || contains(github.event.issue.body, 'Symbol submission from SignalFlow'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            const lib = require(`${process.env.GITHUB_WORKSPACE}/scripts/symbol.js`);
            const fs = require('fs');
            const issue = context.payload.issue;
            let sym;
            try {
              sym = lib.normalise(lib.parseSubmission(issue.body));
              const errs = lib.validate(sym);
              if (errs.length) throw new Error(errs.join('; '));
            } catch (e) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `❌ Not published — the submission no longer validates: ${e.message}` });
              core.setFailed(e.message); return;
            }
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/symbol.json`, JSON.stringify(sym));
            core.setOutput('name', sym.name);
      # Several approvals in a row each start a run, and all of them check out the same library.json:
      # the first push wins and the rest used to fail with "cannot lock ref". So: fetch the latest,
      # merge, push, and on a rejected push start again from the new head.
      # The submitter controls the symbol NAME, so it only ever travels in env vars and files,
      # never pasted into this script's text (that would let a name run shell commands).
      - name: Merge into library.json and push
        id: merge
        env:
          ISSUE: ${{ github.event.issue.number }}
          SYM: ${{ runner.temp }}/symbol.json
          NAME: ${{ steps.check.outputs.name }}
        run: |
          git config user.name "signalflow-bot"
          git config user.email "signalflow-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main
            git reset -q --hard origin/main
            what=$(node scripts/publish-merge.js "$SYM")
            verb=Update; [ "$what" = added ] && verb=Add
            git add library.json
            printf '%s symbol %s (#%s)\n' "$verb" "$NAME" "$ISSUE" | git commit -q -F -
            if git push -q origin HEAD:main; then
              echo "what=$what" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt): another symbol was published first. Retrying on the new library."
            sleep $(( (RANDOM % 6) + 2 ))
          done
          echo "Gave up after 8 attempts."
          exit 1
      - uses: actions/github-script@v7
        env:
          NAME: ${{ steps.check.outputs.name }}
          WHAT: ${{ steps.merge.outputs.what }}
        with:
          script: |
            const issue = context.payload.issue;
            await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number,
              body: `🚀 **${process.env.NAME}** ${process.env.WHAT} in \`library.json\`. Every SignalFlow app picks it up on its next sync (within 30 minutes, or Repo → Sync now).` });
            await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
      - if: failure() && steps.check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.payload.issue.number,
              body: `❌ Not published — pushing to \`library.json\` failed (see the workflow run). Remove the **approved** label and add it again to retry.` });
