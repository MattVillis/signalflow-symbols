name: Validate symbol submission
on:
  issues:
    types: [opened, edited, closed, reopened]
permissions:
  issues: write
  contents: read
jobs:
  validate:
    if: (startsWith(github.event.issue.title, '[symbol]') || startsWith(github.event.issue.title, '[fix]') || contains(github.event.issue.body, 'Symbol submission from SignalFlow') || contains(github.event.issue.body, 'Symbol correction from SignalFlow'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const lib = require(`${process.env.GITHUB_WORKSPACE}/scripts/symbol.js`);
            const fs = require('fs');
            const issue = context.payload.issue;
            const say = body => github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
            const label = (add, remove) => Promise.all([
              add && github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [add] }),
              remove && github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: remove }).catch(() => {}),
            ]);
            // A submission its SENDER closes before review leaves the maintainer's queue and is never published (#28 and #29,
            // 2026-10-27, closed by their sender's account seconds after opening): say so, so a mistake can be undone, and
            // label it withdrawn. Reopening takes the label off. The maintainer's closes and the publish workflow's are not this.
            if (context.payload.action === 'closed' || context.payload.action === 'reopened') {
              const names = issue.labels.map(l => l.name), by = context.payload.sender?.login;
              if (context.payload.action === 'reopened') {
                if (names.includes('withdrawn')) await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: 'withdrawn' }).catch(() => {});
                return;
              }
              if (names.includes('approved') || by !== issue.user.login || by === context.repo.owner) return;
              await say(`This submission was closed by its sender before review, so it has left the maintainer's queue and won't be published.\n\nIf that wasn't meant, press **Reopen issue** below and it goes back in the queue.`);
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: ['withdrawn'] });
              return;
            }
            let sym;
            try { sym = lib.parseSubmission(issue.body); }
            catch (e) {
              await say(`❌ Could not parse the JSON in this issue: ${e.message}\n\nEdit the issue so the body contains a single \`\`\`json block with the symbol.`);
              await label('invalid', 'symbol'); return;
            }
            const errs = lib.validate(sym);
            if (errs.length) {
              await say(`❌ Symbol rejected by validation:\n\n- ${errs.join('\n- ')}\n\nEdit the issue to fix it; validation re-runs automatically.`);
              await label('invalid', 'symbol'); return;
            }
            const norm = lib.normalise(sym);
            const libFile = JSON.parse(fs.readFileSync('library.json', 'utf8'));
            const current = libFile.library || [];
            const sameId = current.find(d => d.id === norm.id);
            const sameName = current.find(d => d.id !== norm.id && d.name === norm.name);
            const notes = [];
            if (lib.isNewCategory(norm.category, libFile)) notes.push(`🆕 **${norm.category}** is a new category: approving this symbol creates it in every app.`);
            const fix = lib.fixTarget(issue.body);
            if (fix) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: ['fix'] });
              if (fix.id !== norm.id) notes.push(`⚠️ this correction names \`${fix.id}\` but the symbol inside has id \`${norm.id}\`.`);
              if (fix.target === 'builtin') {
                await say(`✅ Valid correction to the **built-in** symbol **${norm.name}**.\n\n${lib.summary(norm)}\n\n${notes.join('\n')}\n\nBuilt-in symbols are part of the SignalFlow app, so this is **not** published to the shared library: the maintainer fixes it in the app and closes this issue when that ships.`);
                await label('symbol', 'invalid'); return;
              }
              if (!sameId) notes.push(`⚠️ no shared symbol has id \`${norm.id}\` any more, so approving would ADD it rather than correct it.`);
            }
            if (sameId) notes.push(`ℹ️ id \`${norm.id}\` already exists (**${sameId.name}**, rev ${sameId.rev}) — approving will **update** it.`);
            if (sameName) notes.push(`⚠️ a different symbol already has the name **${norm.name}** (id \`${sameName.id}\`) — approving will add a second one.`);
            await say(`✅ Checks passed: waiting for review.\n\n${lib.summary(norm)}\n\n${notes.join('\n')}\n\nNothing goes into the shared library until the maintainer has reviewed and approved it. **Please leave this issue open**: closing it takes the submission out of the review queue.\n\n<sub>Maintainer: the \`approved\` label publishes it to \`library.json\`; closing it as not planned turns it down.</sub>`);
            await label('symbol', 'invalid');
